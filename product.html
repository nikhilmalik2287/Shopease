<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | ShopEase</title>
  <link rel="icon" href="assets/placeholder.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("shopease_theme") || "light");</script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a> › <a href="products.html">Shop</a>
    </nav>

    <!-- Filled in by product.js -->
    <div id="product-detail">
      <div class="detail-layout skeleton" aria-hidden="true">
        <div class="gallery-main card-img"></div>
        <div style="display:grid;gap:14px;align-content:start">
          <div class="sk-line w40"></div>
          <div class="sk-line"></div>
          <div class="sk-line w60"></div>
          <div class="sk-line w40"></div>
        </div>
      </div>
    </div>

    <section class="section" id="related-section" hidden>
      <div class="section-head"><h2>You may also like</h2></div>
      <div class="product-grid" id="related-grid"></div>
    </section>

    <section class="section" id="recent-section" hidden>
      <div class="section-head"><h2>Recently viewed</h2></div>
      <div class="product-grid" id="recent-grid"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="js/product.js"></script>
</body>
</html>
